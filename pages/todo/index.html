        <section class="nav-bar">

        <div class="editable">
            <h2>Таблица</h2>
            <p>Введите количество дней:</p>
            <select id="daysChoice" onchange="saveDays(this.value)">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
            </select>

            <p>Введите количество пар в день:</p>
            <select id="lessonsChoice" onchange="saveLessons(this.value)">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <button id="showButton" onclick="clearTable()">Очистить таблицу</button>

            <p id="demo"></p>

            <div id="wrapper"></div>
        </div>
